name: Lembretes da agenda

# Chama /api/cron/lembretes a cada 5 minutos. Não usa o Cron da
# Vercel porque o plano Hobby só permite cron diário — o GitHub
# Actions faz o mesmo trabalho de graça, num repositório que já é
# nosso. O GitHub não garante o minuto exato do agendamento (pode
# atrasar alguns minutos em horário de pico), mas a rota busca numa
# janela de 85–95 minutos à frente, então um atraso pequeno não
# perde o lembrete.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  chamar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de lembretes
        run: |
          resposta=$(curl -s -w "\n%{http_code}" -X GET "https://ysraellkunzmann.com/api/cron/lembretes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          corpo=$(echo "$resposta" | head -n -1)
          status=$(echo "$resposta" | tail -n 1)
          echo "$corpo"
          if [ "$status" -ge 300 ]; then
            echo "Falhou com status $status"
            exit 1
          fi
